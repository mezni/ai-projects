[project]
name = "rag-raw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.2",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]  # <-- Add this line
