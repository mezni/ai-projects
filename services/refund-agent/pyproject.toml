[project]
name = "refund-agent"
version = "0.1.0"
description = "Refund processing AI agent service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "pydantic>=2.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
